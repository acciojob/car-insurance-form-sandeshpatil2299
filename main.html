<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- the entire body must be written by student -->
    <form action="" method="post">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required>
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <br>

        <label>gender</label>
        <br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male" required>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female" required>
        <br>

        <label for="cars">Car Brands</label>
        <select name="car" id="cars">
            <option value="">Select car</option>
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
            <option value="mercedez">Mercedez</option>
        </select>
        <br>

        <label for="carage">Car age</label>
        <input type="number" name="carage" id="carage" required>
        <br>

        <label for="dop">Date of Purchase (dop)</label>
        <input type="date" name="dop" id="dop" required>
        <br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>
        <br>

        <input type="submit" value="Submit">

    </form>

    <script type="text/javascript" src="./script.js"></script>
</body>

</html>
